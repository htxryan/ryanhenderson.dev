name: codeql

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Off-peak Mondays: top-of-hour is the GHA high-load slot.
    - cron: "23 6 * * 1"

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4.37.3
        with:
          languages: javascript-typescript
          queries: security-extended

      # autobuild deliberately omitted: this is a static Astro site; CodeQL
      # traces JS/TS sources without a tsc-style build step.
      - uses: github/codeql-action/analyze@v4.37.3
        with:
          category: "/language:javascript-typescript"
