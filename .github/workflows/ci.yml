name: ci

on:
  push:
    branches: [master, rebuild]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.0"

jobs:
  verify:
    name: type-check + unit + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: lockfile dedupe check
        run: pnpm dedupe --check

      - name: pnpm audit (high+critical)
        run: pnpm audit --audit-level=high

      - name: type-check
        run: pnpm check

      - name: build (content checks + tokens + astro + pagefind + CSP hashes)
        run: pnpm build

      - name: unit tests (vitest) + coverage
        run: pnpm test --coverage

      - name: upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 7

      - name: upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    name: Playwright IV scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: install Playwright (chromium + webkit)
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: run IV scenarios (chromium + webkit)
        # No --project filter: both projects defined in playwright.config.ts run.
        # Roughly doubles wall time vs chromium-only; intentional — webkit
        # catches Safari/iOS-specific regressions chromium can't see.
        run: pnpm exec playwright test tests/iv/scenarios.spec.ts --reporter=list
        env:
          CI: "true"

      - name: upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  lhci:
    name: Lighthouse-CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: locate Chrome
        id: chrome
        run: |
          CHROME_PATH=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::No Chrome/Chromium binary found on the runner"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "Using $CHROME_PATH"

      - name: run Lighthouse-CI
        run: pnpm test:lhci
        env:
          CI: "true"

  links:
    name: broken-link sweep (lychee)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    steps:
      - uses: actions/checkout@v6

      - name: download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: lychee
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          # Pin lychee-action to v1.10.0 until v2 binary download is fixed.
          # Arguments: --exclude linkedin.com, then the directory/pattern.
          args: --no-progress --exclude 'linkedin\.com' 'dist/**/*.html'
          fail: true

  deploy:
    name: deploy to Cloudflare Pages (production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Production gate: only runs after every gating job is green AND only
    # on direct pushes to master (i.e. PR merges). Never runs on PRs
    # themselves or on the rebuild branch — both of those need to stay
    # off prod.
    needs: [verify, e2e, lhci, links]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    concurrency:
      # Serialize prod deploys: even if two pushes land in quick
      # succession, only the latest deploys.
      group: cf-pages-deploy-master
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: deploy via Wrangler CLI
        # Avoid cloudflare/wrangler-action@v3 because it still declares
        # a Node 20 action runtime and GitHub annotates every deploy.
        # Pin the CLI itself to Wrangler 4, which was already verified
        # against this project's Cloudflare Pages API-token path.
        run: npx --yes wrangler@4 pages deploy dist --project-name=ryanhenderson-dev --branch=master --commit-hash=${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 6e32c58c0c71b7228ddca35c4c466b6c
