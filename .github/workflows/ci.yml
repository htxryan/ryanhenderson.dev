name: ci

on:
  push:
    branches: [master, rebuild]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.33.0"

jobs:
  verify:
    name: type-check + unit + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: type-check
        run: pnpm check

      - name: build (content checks + tokens + astro + pagefind + CSP hashes)
        run: pnpm build

      - name: unit tests (vitest)
        run: pnpm test

      - name: upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  e2e:
    name: Playwright IV scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: install Playwright (chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: run IV scenarios
        run: pnpm exec playwright test tests/iv/scenarios.spec.ts --reporter=list
        env:
          CI: "true"

      - name: upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  lhci:
    name: Lighthouse-CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: locate Chrome
        id: chrome
        run: |
          CHROME_PATH=$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium)
          if [ -z "$CHROME_PATH" ]; then
            echo "::error::No Chrome/Chromium binary found on the runner"
            exit 1
          fi
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "Using $CHROME_PATH"

      - name: run Lighthouse-CI
        run: pnpm test:lhci
        env:
          CI: "true"
